<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop — SSK & Co | Premium Groceries & Spices</title>
    <meta name="description" content="Browse and shop premium quality spices, dry fruits, and groceries from Santhosh Sai Krishna & Co, Chennai.">
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/grocery-store.jpg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #FAFBFC;
            --bg-card: #FFFFFF;
            --bg-section: #F3F5F7;
            --text-primary: #1A1D23;
            --text-secondary: #5A6170;
            --text-muted: #8B92A0;
            --accent: #0D9F6E;
            --accent-light: #E6F7F0;
            --accent-dark: #087A54;
            --accent-gradient: linear-gradient(135deg, #0D9F6E 0%, #10B981 50%, #34D399 100%);
            --border: #E5E7EB;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.08), 0 4px 8px rgba(0,0,0,0.04);
            --shadow-xl: 0 20px 50px rgba(0,0,0,0.1);
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-primary); 
            line-height: 1.6;
            padding-bottom: 40px;
        }

        /* === NAVIGATION === */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 5%;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .nav-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
            letter-spacing: -0.5px;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-greeting {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }
        .cart-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 14px rgba(13,159,110,0.35);
        }
        .cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13,159,110,0.45);
        }
        .cart-badge {
            background: white;
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* === CAROUSEL === */
        .carousel-wrapper {
            position: relative;
            overflow: hidden;
            margin-bottom: 32px;
        }
        .carousel {
            display: flex;
            overflow-x: hidden;
            scroll-behavior: smooth;
            height: 240px;
        }
        .carousel img {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .carousel-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(transparent, rgba(250,251,252,0.8));
            pointer-events: none;
        }

        /* === SEARCH === */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .search-wrapper { margin-bottom: 32px; position: relative; }
        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(13,159,110,0.1);
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* === SECTION HEADERS === */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--text-primary);
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1.5px solid var(--border);
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }

        /* === CATEGORY CARDS === */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .cat-card {
            background: var(--bg-card);
            padding: 36px 28px;
            text-align: center;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }
        .cat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
            transform: scaleX(0);
            transition: transform 0.35s ease;
        }
        .cat-card:hover::before { transform: scaleX(1); }
        .cat-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: transparent;
        }
        .cat-card h3 {
            font-family: 'Playfair Display', serif;
            color: var(--text-primary);
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        .cat-card p { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }

        /* === PRODUCT CARDS === */
        .prod-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.35s ease;
            display: flex;
            flex-direction: column;
        }
        .prod-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: transparent;
        }
        .prod-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.5s ease;
        }
        .prod-card:hover .prod-img { transform: scale(1.05); }
        .prod-img-wrapper { overflow: hidden; }
        .prod-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
        .prod-name {
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            margin-bottom: 4px;
            font-size: 1rem;
            transition: color 0.3s;
        }
        .prod-name:hover { color: var(--accent); }
        .price-display {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            margin: 8px 0;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }
        .controls select, .controls input {
            padding: 10px 12px;
            background: var(--bg-section);
            color: var(--text-primary);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .controls select { flex: 2; }
        .controls input[type="number"] { width: 70px; flex: none; text-align: center; }
        .controls select:focus, .controls input:focus { border-color: var(--accent); }
        .add-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(13,159,110,0.25);
            margin-top: auto;
        }
        .add-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(13,159,110,0.4);
        }

        /* === PRODUCT MODAL === */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: var(--bg-card);
            width: 100%;
            max-width: 800px;
            border-radius: var(--radius-xl);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow-xl);
            animation: modalSlideUp 0.35s ease;
        }
        @keyframes modalSlideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @media(min-width: 768px) {
            .modal-content { flex-direction: row; height: 480px; }
        }
        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 15px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: var(--shadow-sm);
        }
        .modal-close:hover { background: #FEE2E2; color: #EF4444; border-color: #FECACA; }
        .modal-img {
            flex: 1;
            min-height: 260px;
            background-size: cover;
            background-position: center;
        }
        .modal-details {
            flex: 1.5;
            padding: 32px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .modal-cat {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
            width: fit-content;
        }
        .modal-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        .modal-desc {
            color: var(--text-secondary);
            margin: 12px 0;
            line-height: 1.7;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }

        /* === TOAST === */
        .toast {
            visibility: hidden;
            min-width: 280px;
            background: var(--bg-card);
            color: var(--text-primary);
            text-align: center;
            border-radius: var(--radius);
            padding: 16px 24px;
            position: fixed;
            z-index: 1001;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            font-weight: 600;
            font-size: 0.95rem;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-lg);
            border-left: 4px solid var(--accent);
        }
        .toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 60px 0;
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
            .carousel { height: 180px; }
            .section-title { font-size: 1.4rem; }
            .nav-brand { font-size: 1.25rem; }
            .user-greeting { display: none; }
            .cat-card { padding: 24px 18px; }
            .cat-card h3 { font-size: 1.1rem; }
            .prod-img { height: 150px; }
            .prod-body { padding: 14px; }
            .section-header { flex-direction: column; gap: 12px; align-items: flex-start; }
        }
        @media (max-width: 480px) {
            nav { padding: 12px 16px; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .prod-img { height: 130px; }
            .prod-body { padding: 12px; }
            .prod-name { font-size: 0.88rem; }
            .price-display { font-size: 1.1rem; }
            .controls { flex-direction: column; gap: 6px; }
            .cart-btn { padding: 8px 14px; font-size: 0.82rem; }
        }
    </style>
</head>
<body>
    <nav>
        <span class="nav-brand" onclick="window.location.href='/'">SSK & Co</span>
        <div class="nav-right">
            <span class="user-greeting" id="user-greeting"></span>
            <button class="cart-btn" onclick="window.location.href='/cart'">
                🛒 Bag <span class="cart-badge" id="cart-count">0</span>
            </button>
        </div>
    </nav>

    <div class="carousel-wrapper">
        <div class="carousel" id="shop-carousel">
            <img src="{{ settings['Carousel_Image_1'] }}" alt="Offer 1">
            <img src="{{ settings['Carousel_Image_2'] }}" alt="Offer 2">
        </div>
        <div class="carousel-overlay"></div>
    </div>

    <!-- Search Bar -->
    <div class="container search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Search for products, categories, or keywords..." onkeyup="searchProducts()">
    </div>

    <!-- Categories View -->
    <div class="container" id="category-view">
        <div class="section-header">
            <h2 class="section-title">Shop by Category</h2>
        </div>
        <div class="grid" id="category-grid"></div>
    </div>

    <!-- Products View -->
    <div class="container" id="product-view" style="display:none;">
        <div class="section-header">
            <h2 class="section-title" id="current-category-title">Products</h2>
            <button class="back-btn" onclick="showCategories()">← Back to Categories</button>
        </div>
        <div class="grid" id="product-grid"></div>
    </div>

    <!-- Product Modal -->
    <div id="prod-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-img" id="m-img"></div>
            <div class="modal-details">
                <span class="modal-cat" id="m-cat"></span>
                <h2 class="modal-name" id="m-name"></h2>
                <div class="price-display" style="font-size: 1.6rem;">₹<span id="m-price"></span></div>
                <p class="modal-desc" id="m-desc"></p>
                <div style="margin-top:auto;">
                    <div class="controls" style="margin-bottom: 18px;">
                        <select id="m-weight-select" onchange="updateModalPrice()"></select>
                        <input type="number" id="m-qty" value="1" min="1" onchange="updateModalPrice()">
                    </div>
                    <button class="add-btn" style="padding:15px; font-size:1rem;" onclick="addFromModal()">Add to Bag</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const allProducts = {{ products | tojson }};
        let cart = JSON.parse(localStorage.getItem('sskc_cart')) || [];
        let currentActiveProduct = null;
        let currentCategory = null;

        window.onload = () => {
            const user = JSON.parse(localStorage.getItem('sskc_user'));
            if(!user) { window.location.href = '/'; return; }
            document.getElementById('user-greeting').innerText = `Hello, ${user.Full_Name}`;
            updateCartCount();
            renderCategories();
            
            let currentSlide = 0;
            const carousel = document.getElementById('shop-carousel');
            const slides = carousel.getElementsByTagName('img');
            setInterval(() => {
                if(slides.length > 0) {
                    currentSlide = (currentSlide + 1) % slides.length;
                    carousel.scrollTo({ left: slides[currentSlide].offsetLeft, behavior: 'smooth' });
                }
            }, 5000);
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = 'toast show';
            setTimeout(() => { t.className = t.className.replace('show', ''); }, 3000);
        }

        function updateCartCount() {
            let totalQty = cart.reduce((sum, item) => sum + parseInt(item.qty), 0);
            document.getElementById('cart-count').innerText = totalQty;
        }

        // --- Core Pricing Logic (Handles dynamic weight calculations) ---
        function calculateDynamicPrice(basePrice, weightStr) {
            basePrice = parseFloat(basePrice);
            if(weightStr.includes('pcs') || weightStr.includes('pac')) return basePrice;
            
            let kg = 1;
            if(weightStr.includes('kg')) kg = parseFloat(weightStr);
            else if(weightStr.includes('g')) kg = parseFloat(weightStr) / 1000;

            let price = basePrice * kg;
            
            // Apply markup for smaller packages
            if (kg < 1) {
                if (kg <= 0.25) price += 10;
                else if (kg <= 0.5) price += 10;
                if (kg < 0.1) price += 5;
            }
            return Math.ceil(price / 10) * 10; 
        }

        // --- Navigation ---
        function renderCategories() {
            const categories = [...new Set(allProducts.map(p => p.Category))];
            const grid = document.getElementById('category-grid');
            const emojis = ['🌶️', '🥜', '🍚', '🫘', '🧂', '🌿', '🥣', '🍯', '🫒', '🌾', '🧈', '🍵'];
            grid.innerHTML = categories.map((cat, i) => `
                <div class="cat-card" onclick="showProducts('${cat}')" style="animation: fadeInUp 0.5s ease ${i * 0.1}s both;">
                    <div style="font-size:2.5rem; margin-bottom:12px;">${emojis[i % emojis.length]}</div>
                    <h3>${cat}</h3>
                    <p>Explore Items →</p>
                </div>
            `).join('');
        }

        function renderProductGrid(products) {
            const grid = document.getElementById('product-grid');
            if(products.length === 0) {
                grid.innerHTML = "<p class='empty-message'>No products found matching your search.</p>";
                return;
            }
            
            grid.innerHTML = products.map((p, i) => {
                const optionsHtml = p.Weight_Options.map(w => `<option value="${w}">${w}</option>`).join('');
                return `
                <div class="prod-card" style="animation: fadeInUp 0.5s ease ${i * 0.06}s both;">
                    <div class="prod-img-wrapper">
                        <img src="${p.Image_URL}" class="prod-img" onclick="openModal('${p.Product_ID}')" alt="${p.Name}">
                    </div>
                    <div class="prod-body">
                        <h4 class="prod-name" onclick="openModal('${p.Product_ID}')">${p.Name}</h4>
                        <div class="price-display">₹<span id="price-${p.Product_ID}">0</span></div>
                        <div class="controls">
                            <select id="weight-${p.Product_ID}" onchange="updateCardPrice('${p.Product_ID}', ${p.Price})">
                                ${optionsHtml}
                            </select>
                            <input type="number" id="qty-${p.Product_ID}" value="1" min="1" onchange="updateCardPrice('${p.Product_ID}', ${p.Price})">
                        </div>
                        <button class="add-btn" onclick="addFromCard('${p.Product_ID}', '${p.Name}', '${p.Image_URL}')">Add to Bag</button>
                    </div>
                </div>
                `;
            }).join('');
            
            products.forEach(p => updateCardPrice(p.Product_ID, p.Price));
        }

        function showProducts(category) {
            currentCategory = category;
            document.getElementById('search-input').value = '';
            document.getElementById('category-view').style.display = 'none';
            document.getElementById('product-view').style.display = 'block';
            document.getElementById('current-category-title').innerText = category;
            
            const products = allProducts.filter(p => p.Category === category);
            renderProductGrid(products);
        }

        function showCategories() {
            currentCategory = null;
            document.getElementById('search-input').value = '';
            document.getElementById('category-view').style.display = 'block';
            document.getElementById('product-view').style.display = 'none';
        }
        
        function searchProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            
            if (query.trim() === '') {
                if (currentCategory) showProducts(currentCategory);
                else showCategories();
                return;
            }

            document.getElementById('category-view').style.display = 'none';
            document.getElementById('product-view').style.display = 'block';
            
            if(currentCategory) {
                document.getElementById('current-category-title').innerText = `Search in ${currentCategory}: "${query}"`;
            } else {
                document.getElementById('current-category-title').innerText = `Search Results: "${query}"`;
            }
            
            let filtered = allProducts.filter(p => {
                const matchesSearch = p.Name.toLowerCase().includes(query) || p.Description.toLowerCase().includes(query) || p.Category.toLowerCase().includes(query);
                const matchesCategory = currentCategory ? p.Category === currentCategory : true;
                return matchesSearch && matchesCategory;
            });
            
            renderProductGrid(filtered);
        }

        // --- Card Logic ---
        function updateCardPrice(id, basePrice) {
            const weight = document.getElementById(`weight-${id}`).value;
            const qty = parseInt(document.getElementById(`qty-${id}`).value) || 1;
            const unitPrice = calculateDynamicPrice(basePrice, weight);
            document.getElementById(`price-${id}`).innerText = unitPrice * qty;
        }

        function addFromCard(id, name, image) {
            const weight = document.getElementById(`weight-${id}`).value;
            const qty = parseInt(document.getElementById(`qty-${id}`).value) || 1;
            const totalAmt = parseInt(document.getElementById(`price-${id}`).innerText);
            
            cart.push({ id, name, weight, qty, totalAmt, image });
            localStorage.setItem('sskc_cart', JSON.stringify(cart));
            updateCartCount();
            showToast(`${qty}x ${name} added to Bag!`);
        }

        // --- Modal Logic ---
        function openModal(id) {
            currentActiveProduct = allProducts.find(p => p.Product_ID === id);
            const p = currentActiveProduct;
            
            document.getElementById('m-img').style.backgroundImage = `url('${p.Image_URL}')`;
            document.getElementById('m-cat').innerText = p.Category;
            document.getElementById('m-name').innerText = p.Name;
            document.getElementById('m-desc').innerText = p.Description;
            document.getElementById('m-qty').value = 1;
            
            const wSelect = document.getElementById('m-weight-select');
            wSelect.innerHTML = p.Weight_Options.map(w => `<option value="${w}">${w}</option>`).join('');
            
            updateModalPrice();
            document.getElementById('prod-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('prod-modal').style.display = 'none'; }
        
        function updateModalPrice() {
            if(!currentActiveProduct) return;
            const weight = document.getElementById('m-weight-select').value;
            const qty = parseInt(document.getElementById('m-qty').value) || 1;
            const unitPrice = calculateDynamicPrice(currentActiveProduct.Price, weight);
            document.getElementById('m-price').innerText = unitPrice * qty;
        }

        function addFromModal() {
            const weight = document.getElementById('m-weight-select').value;
            const qty = parseInt(document.getElementById('m-qty').value) || 1;
            const totalAmt = parseInt(document.getElementById('m-price').innerText);
            
            cart.push({ id: currentActiveProduct.Product_ID, name: currentActiveProduct.Name, weight, qty, totalAmt, image: currentActiveProduct.Image_URL });
            localStorage.setItem('sskc_cart', JSON.stringify(cart));
            updateCartCount();
            showToast(`${qty}x ${currentActiveProduct.Name} added to Bag!`);
            closeModal();
        }

        // fadeInUp animation keyframes
        const style = document.createElement('style');
        style.textContent = `@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
